# Cloud / Chromebook profile — FastAPI only (no local Ollama or ComfyUI GPU services)
# Usage:
#   cp .env.example .env   # fill OLLAMA_API_KEY, OPENCODE_API_KEY, COMFY_CLOUD_API_KEY
#   docker compose -f docker-compose.cloud.yml up -d --build

version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vidmuse-server-cloud
    ports:
      - "8000:8000"
    # host.docker.internal resolves on Docker Desktop (macOS/Windows) by
    # default; host-gateway makes it work on Linux too. Needed for the
    # hermes-director lane (HERMES_URL) and the Ollama/Comfy host fallbacks.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - ./outputs:/app/outputs
    env_file:
      - .env
    environment:
      - VIDMUSE_MODE=cloud
      - OUTPUT_DIR=/app/outputs
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    restart: unless-stopped

networks:
  default:
    name: vidmuse-cloud-network
