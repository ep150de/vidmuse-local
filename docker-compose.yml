version: '3.8'

services:
  # VidMuse FastAPI server with llama.cpp + Intel XPU support
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vidmuse-server
    ports:
      # Loopback-only: the studio server has no auth of its own and
      # carries per-session API keys, so it must not be reachable from
      # the LAN.
      - "127.0.0.1:8000:8000"
    # host.docker.internal resolves on Docker Desktop (macOS/Windows) by
    # default; host-gateway makes it work on Linux too. Needed for the
    # hermes-director lane (HERMES_URL) and the Ollama/Comfy host fallbacks.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - ./outputs:/app/outputs
      - ./models:/app/models  # GGUF models
      - ./ComfyUI:/root/comfyui  # ComfyUI models (CUDA)
      - ./comfyui-xpu:/app/comfyui-xpu  # Intel XPU ComfyUI (if installed)
      - ./comfyui_workflows:/app/comfyui_workflows  # Workflow definitions
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434  # fallback to Ollama
      - COMFYUI_URL=http://host.docker.internal:8188
      - OUTPUT_DIR=/app/outputs
      - SERVER_HOST=0.0.0.0
      - GGUF_MODEL_PATH=/app/models/  # llama.cpp model directory
      - XPU_AVAILABLE=false  # Set to true if Intel XPU detected
    depends_on:
      - comfyui
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ComfyUI image/video generation
  comfyui:
    image: comfyanonymous/comfyui:latest
    container_name: vidmuse-comfyui
    ports:
      # Loopback-only for the same reason as the server above.
      - "127.0.0.1:8188:8188"
    volumes:
      - ./ComfyUI:/root/comfyui
      - models:/root/comfyui/models
      - outputs:/root/comfyui/outputs
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  outputs:

networks:
  default:
    name: vidmuse-network